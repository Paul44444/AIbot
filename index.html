<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aibot1</title>
    <link rel="preload" as="image" href="/images/jenny-room-preview.webp" fetchpriority="high" />
    <link rel="prefetch" as="fetch" href="/model/jenny.vrm" crossorigin="anonymous" />
    <link rel="prefetch" as="fetch" href="/animations/idle.vrma" crossorigin="anonymous" />
    <link rel="prefetch" as="fetch" href="/model/room-lod.rad" crossorigin="anonymous" />
    <style>
      html, body { margin: 0; background: #79503c; }
      /* Visible before JavaScript; the live UI remains above this poster. */
      .sceneAtmosphere {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: #79503c;
        opacity: 1;
        transition: opacity 900ms ease, visibility 0s linear 900ms;
      }
      .sceneAtmosphere img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }
      html[data-scene-ready="true"] .sceneAtmosphere {
        opacity: 0;
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .sceneAtmosphere { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="sceneAtmosphere" aria-hidden="true">
      <img src="/images/jenny-room-preview.webp" alt="" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
