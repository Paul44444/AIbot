<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aibot1</title>
    <style>
      /* First paint lives outside React and needs no downloads. */
      html, body { margin: 0; background: #29333b; }
      .sceneAtmosphere {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 72% 36%, #d6c8ab80, transparent 48%),
          linear-gradient(110deg, #29333b 0%, #697575 48%, #a6a496 100%);
      }
      .sceneAtmosphere::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 66%, #eee5cf35 66%, #eee5cf35 67%, transparent 67%),
          linear-gradient(0deg, transparent 48%, #eee5cf25 48%, #eee5cf25 49%, transparent 49%),
          radial-gradient(ellipse at 75% 28%, #fff1cb60, transparent 54%);
        mask-image: linear-gradient(to bottom, black, transparent 78%);
        animation: roomLight 8s ease-in-out infinite alternate;
      }
      .sceneAtmosphere::after {
        content: "";
        position: absolute;
        inset: 66% -20% -25%;
        background:
          radial-gradient(ellipse at 62% 0%, #d9c6a64d, transparent 58%),
          linear-gradient(#65655e, #303c43);
        border-top: 1px solid #e5dfcd30;
        transform: perspective(500px) rotateX(28deg);
        transform-origin: top;
        box-shadow: 0 -35px 90px #eadfc418;
      }
      @keyframes roomLight {
        from { opacity: .5; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sceneAtmosphere::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="sceneAtmosphere" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
