<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aibot1</title>
    <link rel="preload" as="image" href="/images/room-preview.webp" fetchpriority="high" />
    <link rel="prefetch" as="fetch" href="/model/jenny.vrm" crossorigin="anonymous" />
    <link rel="prefetch" as="fetch" href="/animations/idle.vrma" crossorigin="anonymous" />
    <style>
      html, body { margin: 0; background: #79503c; --scene-progress: 7%; }
      /* Visible before JavaScript; the live UI remains above this poster. */
      .sceneAtmosphere {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: #e6c3a0;
        opacity: 1;
        transition: opacity 900ms ease, visibility 0s linear 900ms;
      }
      /* A 308-byte blurred still is part of the HTML, so a background shows instantly. */
      .sceneAtmosphere::before {
        content: "";
        position: absolute;
        inset: -40px;
        background: url("data:image/webp;base64,UklGRiwBAABXRUJQVlA4ICABAAAQCACdASowABsAPt1apU6opKMiMBVaqRAbiWYAp0d1cYbM28T9jAt5ghGXo0C7/sx+v5WsAzq1eSEzSliUAE3boPX99r69uSsAAP7qgmopZTH+dN4gT4amGBpUd7DXIhLHy5MXZ1wvy3CTj/gH/X27PSBDn3Zn7uR95wzEnZV7qut487aA07s84zGHRDJR4vAiqFgkNf+QowsbAqIT1Gi6TGIq0Q5UZa7vTm5xoK9iOp95kQcGErFz3SjUcFNxhKxpi1ArA1rxJWHuO8J2rseC2R9kiuqWs0C5oRyR5yD2+KMgJmkbuAmJPOyljFTyXlxXYKPHuhnvvZyxfBN/oB8sKK7Fle6yle8MnTzLYZExTACzFlYY0BhG/wy0meL0AAA=") center / cover;
        filter: blur(18px);
      }
      .sceneAtmosphere img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        opacity: 0;
        transition: opacity 450ms ease;
      }
      .sceneAtmosphere img.isLoaded { opacity: 1; }
      .sceneAtmosphere { overflow: hidden; }
      .sceneLoading {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9;
        width: 220px;
        height: 5px;
        padding: 34px 12px 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 239, 222, 0.62);
        border-radius: 14px;
        background: rgba(42, 25, 27, 0.72);
        box-shadow: 0 7px 28px rgba(33, 15, 11, 0.34), 0 0 0 rgba(255, 206, 175, 0);
        backdrop-filter: blur(10px);
        animation: sceneLoadingGlow 2.2s ease-in-out infinite;
        /* The first room load is quiet; the card only appears when switching avatars. */
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 0s linear 240ms;
      }
      html[data-avatar-loading="true"] .sceneLoading {
        opacity: 1;
        visibility: visible;
        transition: opacity 240ms ease, visibility 0s linear 0s;
      }
      .sceneLoading::before {
        content: "●  " attr(data-label);
        position: absolute;
        top: 10px;
        left: 12px;
        color: #fff5eb;
        font: 650 12px/1 system-ui, sans-serif;
        letter-spacing: 0.025em;
      }
      .sceneLoading::after {
        content: attr(data-progress) "%";
        position: absolute;
        top: 10px;
        right: 12px;
        color: #ffd5c0;
        font: 700 12px/1 system-ui, sans-serif;
      }
      .sceneLoading span {
        display: block;
        width: var(--scene-progress);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4a990 0%, #fff1d7 48%, #f4a990 100%);
        background-size: 220% 100%;
        box-shadow: 0 0 9px rgba(255, 230, 207, 0.72);
        transition: width 350ms ease;
        animation: sceneLoadingShimmer 1.25s linear infinite;
      }
      @keyframes sceneLoadingGlow {
        0%, 100% { border-color: rgba(255, 239, 222, 0.5); box-shadow: 0 7px 28px rgba(33, 15, 11, 0.34), 0 0 0 rgba(255, 206, 175, 0); }
        50% { border-color: rgba(255, 239, 222, 0.9); box-shadow: 0 9px 32px rgba(33, 15, 11, 0.4), 0 0 22px rgba(255, 206, 175, 0.4); }
      }
      @keyframes sceneLoadingShimmer {
        from { background-position: 110% 0; }
        to { background-position: -110% 0; }
      }
      html[data-scene-ready="true"] .sceneAtmosphere {
        opacity: 0;
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .sceneAtmosphere, .sceneAtmosphere img { transition: none; }
        .sceneLoading, .sceneLoading span { animation: none; }
        .sceneLoading span { transition: none; }
      }
      @media (max-width: 700px) {
        .sceneLoading { right: 12px; bottom: 68px; width: 170px; }
      }
    </style>
  </head>
  <body>
    <div class="sceneAtmosphere" aria-hidden="true">
      <img src="/images/room-preview.webp" alt="" fetchpriority="high" decoding="async" onload="this.classList.add('isLoaded')" />
    </div>
    <div class="sceneLoading" data-progress="7" data-label="Preparing 3D room" role="status" aria-label="Preparing 3D room: 7%"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
